<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family:Bold sans-serif;
            font-weight:bold;
        }
        section{
            background-color: ghostwhite;
            padding:10px;
            margin:15px;
            max-width:600px;
            border-radius: 10px;
            box-shadow: 0 2px 5px gray;
            display:block;
            margin-left:auto;
            margin-right:auto;
        }
        input [type="submit" ], select, textarea {
            width:94%;
            padding:15px;
            border:1px solid white;
            border-radius:5px;
            text-align:center;
        }
        img{
            display: block;
            margin:0 auto;
            height:100px;
            width:100px;
            padding: 0px;
        }
        p{
            text-align: center;
            font-size:20px;
            font-weight:bold;
        }
        h1{
            text-align: center;
            color:white;
            background-color:black;
        }
        
    </style>
</head>
<body>
    <header>
    <h1>RATE A MOVIE</h1>
    <br>
    <p>Share your top pick movie and write a review</p>
    </header>

    <section>
        <form action="">
            <img src="https://thumbs.dreamstime.com/b/movie-icon-items-cinema-white-background-35291742.jpg" alt="Movie Logo">
            <label for="movies"> Select a Movie</label>
              <select id="movies">
                <option value="m1">Select</option>
                <option value="m2">Spirited Away</option>
                <option value="m3">Final Destination 1</option>
                <option value="m4">2012</option>
              </select>
            <br>
             <label for="genre">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="genre1">
              <label for="genre1">Action</label>
            <input type="checkbox" id="genre2" name="genre2">
              <label for="genre2">Comedy</label>
            <input type="checkbox" id="genre3" name="genre3">
              <label for="genre3">Horror</label>
            <input type="checkbox" id="genre4" name="genre4">
              <label for="genre4">Fantasy</label>
            <input type="checkbox" id="genre5" name="genre5">
              <label for="genre5">Sci-Fi</label>
            <input type="checkbox" id="genre6" name="genre6">
              <label for="genre6">Others</label>
              <br>
              <br>
            <label for="rate">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rating">
              <label for="rate1">🌟</label>
            <input type="radio" id="rate2" name="rating">
              <label for="rate2">🌟🌟</label>
            <input type="radio" id="rate3" name="rating">
              <label for="rate3">🌟🌟🌟</label>
            <input type="radio" id="rate4" name="rating">
              <label for="rate4">🌟🌟🌟🌟</label>
            <input type="radio" id="rate5" name="rating">
              <label for="rate5">🌟🌟🌟🌟🌟</label>
              <br>
              <br>
              <textarea id="review" name="review" rows="4" cols="40"
              placeholder="Movie Review"></textarea>
              <br>
              <input type="submit" id=submit"" name="submit" value="Submit Review">
              <br>
              <br>
              For movie review tips, click <a href=https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide" target="_blank">here</a>
             </form>
    </section>
    <!--Reference
        Smith, S. (2026, July 3). How to write a movie Review (A Step-by-Step Guide) — Fantasy/Animation. Fantasy/Animation. https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide-->
</body>
</html>
